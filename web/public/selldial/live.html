<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Selldial Live</title>
  <script>try { if (localStorage.getItem("selldial:theme") === "dark") document.documentElement.dataset.theme = "dark"; } catch {}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="live.css">
</head>
<body>
  <header class="bar" id="bar">
    <div class="bar-left">
      <a class="brand" href="console.html#/home" aria-label="Selldial home">
        <img src="logo.svg" alt="" width="22" height="30">
        <span>Selldial</span>
      </a>
      <div class="session" id="session"></div>
    </div>
    <div class="bar-right">
      <span class="honest">Synthetic demo data</span>
      <a class="link" href="console.html">Console</a>
      <button class="btn" id="open-palette" type="button" aria-haspopup="dialog" aria-keyshortcuts="Control+K Meta+K">Commands <kbd>Ctrl K</kbd></button>
      <button class="btn primary" id="reset" type="button" aria-keyshortcuts="R">Reset demo</button>
    </div>
  </header>

  <main class="regions">
    <section class="region transcript-region" aria-labelledby="t-title">
      <div class="region-head"><h2 id="t-title">Transcript</h2><span class="meta" id="t-meta"></span></div>
      <div class="transcript" id="transcript" aria-live="polite"></div>
    </section>

    <section class="region math-region" aria-labelledby="m-title">
      <div class="region-head"><h2 id="m-title">The math</h2><span class="meta">decision engine, no LLM</span></div>
      <div class="math" id="math"></div>
    </section>

    <aside class="region guard-region" aria-label="Guards and checkout">
      <div class="region-head"><h2 id="g-title">Guards</h2><span class="meta">checked before every action</span></div>
      <ul class="guards" id="guards" aria-labelledby="g-title"></ul>
      <div class="checkout" id="checkout" hidden></div>
    </aside>
  </main>

  <section class="signals" aria-labelledby="s-title">
    <h2 id="s-title">Signals used</h2>
    <ul id="signals"></ul>
  </section>

  <section class="audit-band" id="audit-band" aria-labelledby="a-title" tabindex="-1">
    <div class="region-head"><h2 id="a-title">Audit log</h2><span class="meta" id="a-meta">newest first</span></div>
    <div class="band-error" id="a-error" hidden></div>
    <ol class="audit" id="audit"></ol>
  </section>

  <div class="palette-scrim" id="palette-scrim" hidden></div>
  <div class="palette" id="palette" role="dialog" aria-modal="true" aria-label="Commands" hidden>
    <input id="palette-input" type="text" placeholder="Type a command" aria-label="Filter commands" autocomplete="off" role="combobox" aria-expanded="true" aria-controls="palette-list">
    <ul id="palette-list" role="listbox" aria-label="Commands"></ul>
  </div>

  <script src="session-demo.js"></script>
  <script src="live.js"></script>
</body>
</html>
