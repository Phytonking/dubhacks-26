<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Selldial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="icon" href="selldial-logo-icon.png" type="image/png">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="landing.css">
</head>
<body>
  <main class="hero">
    <img class="logo-full" src="selldial-logo-full.png" alt="Selldial" width="1163" height="327">
    <p class="tagline">The sell line that helps customers buy.</p>

    <div class="choices">
      <a class="btn primary" href="console.html#/home" data-provider="T-Mobile">
        <svg class="tmark" viewBox="0 0 48 48" aria-hidden="true">
          <rect x="7" y="22" width="6" height="6" rx="1"/>
          <rect x="35" y="22" width="6" height="6" rx="1"/>
          <path d="M11 9h26v8h-3.2c-.4-2.6-1.8-3.8-4.6-3.8H27V35c0 2.3.8 3 3.3 3V41H17.7v-3c2.5 0 3.3-.7 3.3-3V13.2h-2.2c-2.8 0-4.2 1.2-4.6 3.8H11Z"/>
        </svg>
        <span>Log in with T&#8209;Mobile</span>
      </a>
      <a class="btn secondary" href="console.html#/home" data-provider="Email">Log in via another provider</a>
    </div>
  </main>

  <footer class="foot">
    <p>Demo sign-in: no credentials are collected. All customer data is synthetic.</p>
  </footer>

  <script>
    // Demo sign-in: remember the provider for the console's profile, then continue.
    document.querySelectorAll(".btn").forEach((a) => a.addEventListener("click", () => {
      try { localStorage.setItem("selldial:provider", a.dataset.provider); } catch {}
    }));
  </script>
</body>
</html>
