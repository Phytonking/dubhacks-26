<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Selldial Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>try { if (localStorage.getItem("selldial-theme") === "light") document.documentElement.dataset.theme = "light"; } catch (e) {}</script>
  <link rel="icon" href="selldial-logo-icon.png" type="image/png">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="nav">
      <a class="brand" href="#/home" aria-label="Selldial home">
        <img class="logo" src="selldial-logo-icon.png" alt="" width="25" height="30">
        <span class="brand-name">Selldial</span>
      </a>
      <button class="menu-btn" type="button" data-menu aria-expanded="false" aria-controls="nav-panel">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>Menu
      </button>
      <div class="nav-panel" id="nav-panel">
        <nav class="nav-links" id="nav" aria-label="Main"></nav>
        <a class="signout" href="index.html">Sign out</a>
      </div>
    </aside>

    <main class="main">
      <header class="top">
        <h1 id="view-title">Home</h1>
        <div class="top-right">
          <span class="tenant">T-Mobile demo</span>
          <span class="avatar" id="avatar" aria-hidden="true"></span>
        </div>
      </header>
      <section id="view" class="view"></section>
    </main>
  </div>

  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" inert></aside>
  <div class="toast" id="toast" role="status" hidden></div>

  <script src="data.js"></script>
  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
