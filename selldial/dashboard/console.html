<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Selldial Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>try { if (localStorage.getItem("selldial:theme") === "dark") document.documentElement.dataset.theme = "dark"; } catch {}</script>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="nav">
      <div class="brand">
        <img class="logo" src="logo.svg" alt="" width="22" height="30">
        <span class="brand-name">Selldial</span>
      </div>
      <nav class="nav-links" id="nav"></nav>
      <div class="line-card" id="line-card"></div>
      <a class="signout" href="./">Sign out</a>
    </aside>

    <main class="main">
      <header class="top">
        <div>
          <h1 id="view-title">Overview</h1>
          <p class="sub" id="view-sub"></p>
        </div>
        <div class="top-right">
          <span class="honest">Synthetic demo data</span>
          <a class="btn ghost" href="live.html">Live session</a>
          <span class="mode-pill" id="mode-pill"></span>
          <button class="btn ghost" id="refresh" type="button">Refresh</button>
        </div>
      </header>
      <section id="view" class="view"></section>
    </main>
  </div>

  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" inert></aside>
  <div class="toast" id="toast" role="status" hidden></div>

  <script src="data.js"></script>
  <script src="customers-data.js"></script>
  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
